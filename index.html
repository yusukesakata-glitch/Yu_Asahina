<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顧客マップDB Pro (8列対応版)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* --- デザイン定義 --- */
        :root {
            --bg: #f9f8f6;
            --card: #ffffff;
            --text-main: #333333;
            --text-sub: #777777;
            --gold: #bfa37e;
            --gold-light: #f0ebe5;
            --dark: #222222;
            --alert: #c62828;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --radius: 6px;
            --font-serif: 'Shippori Mincho', serif;
            --font-eng: 'Cinzel', serif;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 0;
            height: 100vh; overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.04em;
        }

        .svg-icon { width: 1.2em; height: 1.2em; fill: currentColor; vertical-align: middle; }

        .app-container { display: flex; flex-direction: column; height: 100%; max-width: 1600px; margin: 0 auto; padding: 20px; box-sizing: border-box; gap: 20px; }
        
        @media (min-width: 900px) {
            body { overflow: hidden; }
            .app-container { flex-direction: row; padding: 30px; }
            .left-section { flex: 2; display: flex; flex-direction: column; gap: 15px; height: 100%; }
            .right-section { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 420px; overflow-y: auto; padding-right: 5px; }
            .map-wrapper { flex: 1; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; border: 1px solid var(--border); }
        }
        @media (max-width: 899px) {
            .app-container { display: block; padding: 15px; }
            .map-wrapper { height: 45vh; min-height: 300px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; margin-bottom: 20px; border: 1px solid var(--border); }
            .right-section { padding-bottom: 120px; }
        }

        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-family: var(--font-eng); font-size: 1.4rem; font-weight: 600; margin: 0; letter-spacing: 0.05em; color: var(--text-main); }
        
        .btn-settings {
            background: #fff; border: 1px solid var(--border);
            padding: 8px 16px; border-radius: var(--radius);
            font-family: var(--font-serif); font-size: 0.85rem; cursor: pointer;
            color: var(--text-main); display: flex; align-items: center; gap: 8px;
            transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .btn-settings:hover { border-color: var(--gold); color: var(--gold); }

        .search-box-style { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); padding: 5px 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .search-input-style { flex: 1; border: none; padding: 10px; font-size: 0.95rem; background: transparent; outline: none; font-family: var(--font-serif); }
        .search-btn-style { background: none; border: none; padding: 0 5px; color: var(--gold); cursor: pointer; display: flex; align-items: center; }

        .filter-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--text-main); font-family: var(--font-serif); font-size: 0.85rem; appearance: none; -webkit-appearance: none; text-align: center; cursor: pointer; }

        .list-search-box { position: relative; margin-bottom: 20px; }

        #google-map-view { width: 100%; height: 100%; }
        .btn-current-loc { position: absolute; bottom: 80px; right: 15px; z-index: 10; width: 44px; height: 44px; background: var(--card); border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-current-loc.locked { background: var(--gold); color: white; }
        
        .map-sync-wrapper { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 4px 10px; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; font-size: 0.75rem; border: 1px solid rgba(0,0,0,0.05); }

        .toggle-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ddd; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(16px); }

        #stats-area { background: var(--card); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); }
        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;}
        .stats-total { font-family: var(--font-eng); font-weight: 600; font-size: 0.95rem; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .stats-item { font-size: 0.75rem; padding: 5px 12px; background: #f8f8f8; border-radius: 4px; cursor: pointer; border: 1px solid #eee; color: var(--text-sub); }
        .stats-item.selected { background: var(--gold); color: #fff; border-color: var(--gold); }

        .customer-item { background: var(--card); padding: 20px; border-radius: var(--radius); margin-bottom: 15px; display: flex; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02); transition: transform 0.2s; }
        .customer-item:hover { transform: translateY(-2px); }

        .action-area { display: flex; flex-direction: column; gap: 8px; min-width: 100px; margin-left: 20px; }
        .action-btn { width: 100%; padding: 8px; border-radius: 4px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 0.75rem; color: var(--text-sub); cursor: pointer; font-family: var(--font-eng); box-sizing: border-box; }
        .action-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }

        @media (max-width: 899px) {
            .customer-item { flex-direction: column; }
            .action-area { flex-direction: row; margin-left: 0; margin-top: 15px; border-top: 1px solid #f0f0f0; padding-top: 15px; }
        }

        .info-main { font-weight: 600; font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .info-sub { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .credit-alert { color: var(--alert); font-weight: bold; }
        .tag { background: #f2f2f2; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; color: #666; border: 1px solid #eee; }
        .tag-id { background: var(--gold-light); color: #5a4b35; border-color: #e0d5c5; }
        .btn-copy { font-size: 0.65rem; background: transparent; border: 1px solid #ddd; padding: 1px 6px; border-radius: 3px; cursor: pointer; color: #999; margin-left: 8px; }
        .note-box { font-size: 0.75rem; color: #8a6d3b; margin-top: 8px; background: #fcf8e3; padding: 6px 10px; border-radius: 4px; display: inline-block; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(44, 44, 44, 0.7); backdrop-filter: blur(5px); display:none; justify-content:center; align-items:center; z-index:9999; }
        .modal-content { background: #fff; padding: 30px; border-radius: 4px; width: 95%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-content h3 { font-family: var(--font-eng); text-align: center; margin-top: 0; letter-spacing: 0.1em; }

        .settings-section { border-bottom: 1px solid #f0f0f0; padding-bottom: 25px; margin-bottom: 25px; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--gold); margin-bottom: 6px; margin-top: 15px; font-family: var(--font-eng); }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius); font-size: 16px; font-family: var(--font-serif); box-sizing: border-box; }
        
        .btn-main { width: 100%; padding: 14px; background: var(--dark); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; margin-top: 20px; font-family: var(--font-eng); transition: 0.3s; }
        .btn-main:hover { background: var(--gold); }
        .btn-sub { padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: var(--radius); cursor: pointer; font-size: 0.8rem; }

        #map-placeholder-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.9); padding: 30px; border-radius: var(--radius); text-align: center; width: 80%; border: 1px solid #eee; }
        .chip { font-size: 0.75rem; background: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; border: 1px solid #ddd; color: var(--text-sub); }
        .chip:hover { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-section">
        <div class="search-row">
            <div class="place-search-box search-box-style">
                <input type="text" id="mapJumpInput" class="place-search-input search-input-style" placeholder="エリア検索 (例: 銀座)" onkeydown="if(event.key==='Enter')searchMapLocation()">
                <button class="place-search-btn search-btn-style" onclick="searchMapLocation()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
        </div>

        <div class="map-wrapper">
            <div id="google-map-view"></div>
            <div id="map-placeholder-msg">マップ読込中...</div>
            <div class="map-sync-wrapper">
                <span>連動</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="mapSyncToggle" onchange="toggleMapSync()">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn-current-loc" id="gpsBtn" onclick="toggleGPS()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            </button>
        </div>
    </div>

    <div class="right-section">
        <div class="header-area">
            <h1>顧客管理 DB Pro</h1>
            <button class="btn-settings" onclick="openSettings()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.83 8.89a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                設定
            </button>
        </div>

        <div class="filter-area">
            <select id="prefFilter" onchange="onPrefChange()"><option value="ALL">都道府県: すべて</option></select>
            <select id="stationFilter" onchange="resetAndRender()"><option value="ALL">駅名: すべて</option></select>
        </div>
        
        <div class="list-search-box search-box-style">
            <input type="text" id="searchInput" class="search-input-style" placeholder="名前、IDなどで検索..." oninput="resetAndRender()">
            <button class="search-btn-style" style="pointer-events: none;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>

        <div id="stats-area">
            <div class="stats-header">
                <div class="stats-total" id="stats-total-text">-- 件</div>
                <select id="limitSelect" class="limit-select" onchange="changeLimit()" style="width:auto; padding:5px;">
                    <option value="100">表示: 100件</option>
                    <option value="ALL">表示: 全件</option>
                </select>
            </div>
            <div id="stats-detail" class="stats-grid"></div>
        </div>

        <div id="result-area"></div>
        <button id="load-more-btn" class="btn-main" onclick="loadMore()" style="display:none; background:var(--gold);">もっと見る</button>
        <div style="height:80px;"></div>
    </div>
</div>

<div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
        <h3>設定</h3>
        
        <div class="settings-section">
            <label>Google Maps APIキー</label>
            <div style="display:flex; gap:10px;">
                <input type="password" id="apiKey" placeholder="AIzaSy...">
                <button onclick="saveKeyAndInit()" class="btn-sub">保存</button>
            </div>
        </div>

        <div class="settings-section">
            <label style="color:var(--text-main); font-size:1rem;">📥 データ一括取り込み</label>
            <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:10px;">
                形式: 担当者 | ID | 社名 | 店名 | 住所 | ビル名 | 電話 | 与信
            </p>
            <textarea id="csvInput" placeholder="佐藤	R001	(株)ABC	銀座店	東京都中央区...	XXビル	03-1234...	前金" style="height:120px;"></textarea>
            <button class="btn-main" id="runBtn" onclick="processData()">取り込み実行（駅名自動取得）</button>
            <div id="log-area" style="margin-top:10px; font-size:0.7rem; color:#999; text-align:center;"></div>
        </div>

        <div class="settings-section">
            <label>データ操作</label>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn-sub" onclick="shareOrDownload()">保存 (JSON)</button>
                <button class="btn-sub" onclick="document.getElementById('fileInput').click()">読込 (JSON)</button>
            </div>
            <input type="file" id="fileInput" style="display:none" onchange="uploadData(this)">
            <button class="btn-sub" style="width:100%; margin-top:10px; color:#c62828;" onclick="clearAll()">全データ削除</button>
        </div>

        <button class="btn-main" style="background:#eee; color:#333;" onclick="document.getElementById('settingsModal').style.display='none'">閉じる</button>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3>情報編集</h3>
        <input type="hidden" id="edit-id"><input type="hidden" id="orig-addr">
        <label>担当者</label><input type="text" id="edit-rep">
        <label>管理ID</label><input type="text" id="edit-r">
        <label>店名・社名</label><input type="text" id="edit-name">
        <label>住所</label><input type="text" id="edit-addr">
        <label>ビル名</label><input type="text" id="edit-building">
        <label>電話番号</label><input type="text" id="edit-tel">
        <label>与信</label><input type="text" id="edit-credit" style="color:var(--alert); font-weight:bold;">
        <label>最寄り駅</label><input type="text" id="edit-station">
        <label>メモ</label><textarea id="edit-note"></textarea>
        
        <div style="display:flex; gap:15px; margin-top:30px;">
            <button class="btn-sub" style="flex:1;" onclick="closeModal()">キャンセル</button>
            <button class="btn-main" style="flex:1; margin-top:0;" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<script>
    const DB_NAME = "map_db_pro";
    let db = [];
    let map, geocoder, placesService, AdvancedMarkerElement;
    let markers = [];
    let infoWindow;
    let currentLimit = 100;
    let activeReps = new Set();
    let mapSyncMode = false;
    let highlightedId = null;

    window.onload = () => {
        const k = localStorage.getItem('map_apiKey');
        const d = localStorage.getItem(DB_NAME);
        if(d) { try { db = JSON.parse(d); populateFilters(); resetAndRender(); } catch(e){ db=[]; } }
        if(k) {
            document.getElementById('apiKey').value = k;
            initSystem(k);
        }
    };

    async function initSystem(key) {
        if(!window.google) {
            await new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&libraries=places,geocoding,marker`;
                s.async = true; s.onload = resolve;
                document.head.appendChild(s);
            });
        }
        const { Map } = await google.maps.importLibrary("maps");
        const { Geocoder } = await google.maps.importLibrary("geocoding");
        const { AdvancedMarkerElement: AM } = await google.maps.importLibrary("marker");
        
        geocoder = new Geocoder(); AdvancedMarkerElement = AM;
        const div = document.getElementById('google-map-view');
        map = new Map(div, { center:{lat:35.68, lng:139.76}, zoom:13, mapId: "DEMO_MAP_ID" });
        infoWindow = new google.maps.InfoWindow();
        placesService = new google.maps.places.PlacesService(map);

        map.addListener('idle', () => { if(mapSyncMode) render(); });
        document.getElementById('map-placeholder-msg').style.display='none';
        render();
    }

    async function processData() {
        const csv = document.getElementById('csvInput').value.trim();
        if(!csv) return alert('データを貼り付けてください');
        const btn = document.getElementById('runBtn'); btn.disabled = true; btn.innerText = "処理中...";
        
        try {
            const lines = csv.split('\n');
            let count = 0; let updateCount = 0;

            for(let line of lines) {
                const cols = line.trim().split(/\t/).map(s=>s.trim());
                if(cols.length < 5) continue; 

                // 列定義: 0担当 | 1ID | 2社名 | 3店名 | 4住所 | 5ビル名 | 6電話 | 7与信
                let rep = cols[0];
                let rCode = cols[1];
                let name = (cols[2] + " " + cols[3]).trim();
                let addr = cols[4];
                let build = cols[5] || "";
                let tel = cols[6] || "";
                let credit = cols[7] || "";

                const existing = db.find(d => d.r_code === rCode);

                if (existing) {
                    // 更新処理
                    existing.rep_name = rep;
                    existing.name = name;
                    existing.address = addr;
                    existing.building = build;
                    existing.tel = tel;
                    existing.credit = credit;
                    updateCount++;
                } else {
                    // 新規処理
                    try {
                        const geoRes = await new Promise((res, rej) => geocoder.geocode({ address: addr }, (r, s) => s==='OK'?res(r[0]):rej(s)));
                        const loc = geoRes.geometry.location;

                        // 駅名自動取得
                        let autoStation = "";
                        const stRes = await new Promise(res => {
                            placesService.nearbySearch({ location: loc, radius: 1000, type: ['transit_station'] }, (results, status) => {
                                res(status === google.maps.places.PlacesServiceStatus.OK ? results : []);
                            });
                        });
                        if(stRes.length > 0) autoStation = stRes[0].name.replace(/駅$/,"");

                        db.push({
                            id: Math.random().toString(36).substr(2, 9),
                            r_code: rCode, rep_name: rep, name: name, address: addr, building: build,
                            tel: tel, credit: credit, lat: loc.lat(), lng: loc.lng(), station: autoStation, note: ""
                        });
                        count++;
                        document.getElementById('log-area').innerText = `新規取得中... ${count}件目`;
                    } catch(e) { console.error("Geocode error", e); }
                    await new Promise(r => setTimeout(r, 400));
                }
            }
            saveDB(); populateFilters(); render();
            alert(`完了: 新規 ${count} 件 / 更新 ${updateCount} 件`);
        } finally { btn.disabled = false; btn.innerText = "取り込み実行"; }
    }

    function render() {
        const area = document.getElementById('result-area'); area.innerHTML = "";
        const fPref = document.getElementById('prefFilter').value;
        const fSt = document.getElementById('stationFilter').value;
        const q = (document.getElementById('searchInput').value || "").toLowerCase();

        let filtered = db.filter(d => {
            if(fPref !== "ALL" && !d.address.includes(fPref)) return false;
            if(fSt !== "ALL" && d.station !== fSt) return false;
            if(q && !`${d.name}${d.r_code}${d.rep_name}${d.address}`.toLowerCase().includes(q)) return false;
            return true;
        });

        // 統計表示
        const counts = {}; filtered.forEach(d => counts[d.rep_name] = (counts[d.rep_name] || 0) + 1);
        const detailBox = document.getElementById('stats-detail'); detailBox.innerHTML = "";
        Object.keys(counts).sort().forEach(name => {
            const div = document.createElement('div'); div.className = `stats-item ${activeReps.has(name)?'selected':''}`;
            div.innerHTML = `${name} <span style="font-weight:600;">${counts[name]}</span>`;
            div.onclick = () => { if(activeReps.has(name)) activeReps.delete(name); else activeReps.add(name); render(); };
            detailBox.appendChild(div);
        });

        if(activeReps.size) filtered = filtered.filter(d => activeReps.has(d.rep_name));
        document.getElementById('stats-total-text').innerText = `該当: ${filtered.length} 件`;

        const displayTargets = filtered.slice(0, currentLimit);
        updateMapPins(displayTargets);

        displayTargets.forEach(c => {
            const div = document.createElement('div');
            div.className = 'customer-item';
            div.innerHTML = `
                <div style="flex:1;">
                    <div class="info-main">
                        <span class="status-dot" style="background:var(--gold);"></span>
                        <span>${c.name}</span>
                        ${c.credit ? `<span class="credit-alert">【${c.credit}】</span>` : ""}
                    </div>
                    <div class="info-sub">
                        <span class="tag tag-id">${c.r_code}</span> 担当: ${c.rep_name}
                        ${c.station ? `<span class="tag">駅: ${c.station}</span>` : ""}
                    </div>
                    <div class="info-sub">${c.tel} <button class="btn-copy" onclick="copyToClipboard('${c.tel}')">COPY</button></div>
                    <div class="info-sub">${c.address} ${c.building}</div>
                    ${c.note ? `<div class="note-box">${c.note}</div>` : ""}
                </div>
                <div class="action-area">
                    <button onclick="openEdit('${c.id}')" class="action-btn">編集</button>
                    <a href="tel:${c.tel}" class="action-btn">発信</a>
                    <button onclick="panToMap(${c.lat}, ${c.lng}, '${c.id}')" class="action-btn">地図</button>
                </div>
            `;
            area.appendChild(div);
        });
    }

    function updateMapPins(targets) {
        if(!map) return;
        markers.forEach(m => m.setMap(null)); markers = [];
        targets.forEach(c => {
            const pin = document.createElement("div");
            pin.style.width = "18px"; pin.style.height = "18px";
            pin.style.backgroundColor = c.id === highlightedId ? "#FFD60A" : "#bf5b5b";
            pin.style.borderRadius = "50%"; pin.style.border = "2px solid white"; pin.style.boxShadow = "0 2px 5px rgba(0,0,0,0.2)";
            
            const m = new AdvancedMarkerElement({ position: {lat:c.lat, lng:c.lng}, map: map, content: pin });
            m.addListener("click", () => {
                infoWindow.setContent(`<div style="padding:10px; font-family:sans-serif;"><b>${c.name}</b><br>${c.address}<br><br><button onclick="openEdit('${c.id}')">編集を開く</button></div>`);
                infoWindow.open(map, m);
            });
            markers.push(m);
        });
    }

    function panToMap(lat, lng, id) {
        highlightedId = id;
        map.panTo({lat, lng}); map.setZoom(17);
        if(window.innerWidth < 900) document.querySelector('.left-section').scrollIntoView({behavior:'smooth'});
        render();
    }

    function openEdit(id) {
        const d = db.find(x => x.id === id); if(!d) return;
        document.getElementById('edit-id').value = d.id;
        document.getElementById('edit-rep').value = d.rep_name;
        document.getElementById('edit-r').value = d.r_code;
        document.getElementById('edit-name').value = d.name;
        document.getElementById('edit-addr').value = d.address;
        document.getElementById('edit-building').value = d.building;
        document.getElementById('edit-tel').value = d.tel;
        document.getElementById('edit-credit').value = d.credit;
        document.getElementById('edit-station').value = d.station;
        document.getElementById('edit-note').value = d.note;
        document.getElementById('editModal').style.display = 'flex';
    }

    function saveEdit() {
        const id = document.getElementById('edit-id').value;
        const d = db.find(x => x.id === id);
        if(d) {
            d.rep_name = document.getElementById('edit-rep').value;
            d.r_code = document.getElementById('edit-r').value;
            d.name = document.getElementById('edit-name').value;
            d.address = document.getElementById('edit-addr').value;
            d.building = document.getElementById('edit-building').value;
            d.tel = document.getElementById('edit-tel').value;
            d.credit = document.getElementById('edit-credit').value;
            d.station = document.getElementById('edit-station').value;
            d.note = document.getElementById('edit-note').value;
            saveDB(); render(); closeModal();
        }
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function saveDB() { localStorage.setItem(DB_NAME, JSON.stringify(db)); }
    function populateFilters() {
        const pSel = document.getElementById('prefFilter');
        const prefs = [...new Set(db.map(d => d.address.match(/...??[都道府県]/)?.[0]))].filter(Boolean).sort();
        pSel.innerHTML = '<option value="ALL">都道府県: すべて</option>';
        prefs.forEach(p => pSel.innerHTML += `<option value="${p}">${p}</option>`);
    }
    function onPrefChange() {
        const p = document.getElementById('prefFilter').value;
        const sSel = document.getElementById('stationFilter');
        const stations = [...new Set(db.filter(d => p === "ALL" || d.address.includes(p)).map(d => d.station))].filter(Boolean).sort();
        sSel.innerHTML = '<option value="ALL">駅名: すべて</option>';
        stations.forEach(s => sSel.innerHTML += `<option value="${s}">${s}</option>`);
        render();
    }
    function resetAndRender() { render(); }
    function toggleMapSync() { mapSyncMode = document.getElementById('mapSyncToggle').checked; }
    function copyToClipboard(t) { navigator.clipboard.writeText(t); alert("コピーしました"); }
    function saveKeyAndInit() { const k = document.getElementById('apiKey').value; localStorage.setItem('map_apiKey', k); location.reload(); }
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function clearAll() { if(confirm("全削除しますか？")) { localStorage.removeItem(DB_NAME); location.reload(); } }
    function shareOrDownload() { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'map_db.json'; a.click(); }
    function uploadData(i) { const f = i.files[0]; const r = new FileReader(); r.onload = e => { db = JSON.parse(e.target.result); saveDB(); location.reload(); }; r.readAsText(f); }
</script>
</body>
</html>
